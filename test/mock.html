<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mock WhatsApp Web</title>
<link rel="stylesheet" href="../src/content.css">
<style>
  /* Reproduz a CADEIA real medida no WhatsApp Web (out/2025):
     app-row(flex) > [rail, wrapper(flex:0 0 40%; max-width:40%), mainwrap(flex:1 1 auto)]
     wrapper > [header, #side(flex:1 1 auto) > [search, #pane-side > lista > linhas]]
     As linhas NAO tem role="listitem" — como na pagina real. */
  * { box-sizing: border-box; }
  body { margin:0; font:14px -apple-system,"Segoe UI",Roboto,sans-serif; background:#0b141a; color:#e9edef; }
  #app { height:100vh; }
  .app-row { display:flex; height:100%; position:relative; }
  /* camada de divisorias do WhatsApp: posicionada pela largura ORIGINAL,
     nao acompanha o colapso (e a origem do tracinho no meio do chat) */
  .drawers { position:absolute; inset:0; display:flex; pointer-events:none; }
  [data-testid="drawer-left"] { position:relative; flex:0 0 40%; }
  [data-testid="drawer-middle"] { position:relative; flex:1 1 auto; }
  /* a divisoria real usa border-inline-start-color: var(--WDS-lines-divider) */
  .divisor { position:absolute; right:0; top:0; height:100%; border-inline-start:1px solid var(--WDS-lines-divider); }
  .conteudo-drawer { position:absolute; right:0; top:60px; width:180px; padding:8px; background:#202c33; }
  .rail { flex:0 0 64px; background:#202c33; border-right:1px solid #222d34; }
  .wrapper { flex:0 0 40%; max-width:40%; display:flex; flex-direction:column; background:#111b21; border-right:1px solid #222d34; }
  .wrapper > header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; background:#202c33; font-weight:600; }
  #side { flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .search { padding:8px 12px; }
  .search input { width:100%; padding:8px 12px; border:0; border-radius:8px; background:#202c33; color:#e9edef; }
  #pane-side { flex:1 1 auto; overflow-y:auto; }
  .list > div { border-bottom:1px solid #222d34; }
  .rowflex { display:flex; align-items:center; gap:12px; height:72px; padding:0 12px; }
  .avatar { flex:0 0 49px; width:49px; height:49px; border-radius:50%; background:#6a7175; }
  .content { flex:1; min-width:0; }
  .titlerow { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .namewrap { min-width:0; }
  .namewrap span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .time { flex:0 0 auto; font-size:12px; color:#8696a0; }
  .msgrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:2px; }
  .preview { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; color:#8696a0; }
  .pill { display:inline-block; min-width:20px; padding:0 6px; border-radius:10px; background:#00a884; color:#111b21; font-size:12px; text-align:center; }
  .mainwrap { flex:1 1 auto; min-width:0; }
  #main { height:100%; display:flex; flex-direction:column; background:#0b141a; }
  #main header { height:60px; background:#202c33; display:flex; align-items:center; padding:0 16px; font-weight:600; }
  .msgs { flex:1; padding:16px; }
  .bubble { max-width:60%; margin:8px 0; padding:8px 12px; border-radius:8px; background:#202c33; }
  .bubble.me { margin-left:auto; background:#005c4b; }
</style>
</head>
<body>
<div id="app">
  <div class="app-row">
    <nav class="rail"></nav>
    <div class="wrapper">
      <header><span>WhatsApp</span><span>⋮</span></header>
      <div id="side">
        <div class="search"><input placeholder="Pesquisar"></div>
        <div id="pane-side"><div class="list"></div></div>
      </div>
    </div>
    <div class="mainwrap"></div>
    <div class="drawers">
      <div data-testid="drawer-left"><div><span class="divisor"></span></div></div>
      <div data-testid="drawer-middle"><div><span class="divisor"></span></div></div>
    </div>
  </div>
</div>

<script>
// Cenarios da cor da divisoria:
//   (padrao)        token --WDS-lines-divider definido, como na pagina real
//   ?notoken=1      sem token, mas com cor propria na borda  -> plano B do JS
//   ?currentcolor=1 sem token e sem cor -> resolve currentColor (a armadilha)
const par = new URLSearchParams(location.search);
if (par.has('currentcolor')) {
  /* nada: var() indefinida na borda cai em currentColor */
} else if (par.has('notoken')) {
  document.head.insertAdjacentHTML('beforeend',
    '<style>.divisor{border-inline-start-color:rgb(220, 224, 226)}</style>');
} else {
  document.documentElement.style.setProperty('--WDS-lines-divider', 'rgba(11, 20, 26, 0.08)');
}

const nomes = ["Mãe","Grupo da Família","Você","Trabalho — Equipe","Pedro Henrique","Condomínio Bloco B","Ana Paula","Suporte Técnico"];
const list = document.querySelector('.list');
nomes.forEach((n,i) => {
  const row = document.createElement('div');   // sem role: igual a pagina real
  row.innerHTML = `
    <div class="rowflex">
      <div class="avatar"></div>
      <div class="content">
        <div class="titlerow">
          <div class="namewrap"><span dir="auto" title="${n}">${n}</span></div>
          <div class="time">1${i}:3${i}</div>
        </div>
        <div class="msgrow">
          <div class="preview"><span>Prévia bem longa da última mensagem da conversa ${i}</span></div>
          <div class="badges">${i % 3 === 0 ? '<span class="pill">'+(i+1)+'</span>' : ''}</div>
        </div>
      </div>
    </div>`;
  list.appendChild(row);
});

// #main so existe com uma conversa aberta. ?nomain=N atrasa N ms para simular
// o boot do app — foi assim que a deteccao caiu no fallback errado.
function montarMain() {
  document.querySelector('.mainwrap').innerHTML =
    '<div id="main"><header>Fulano de Tal</header><div class="msgs">' +
    '<div class="bubble">Mensagem recebida</div>' +
    '<div class="bubble me">Mensagem enviada</div></div></div>';
}
// ?drawer=1 monta conteudo de verdade num drawer, para conferir que a regra
// das divisorias nao engole conteudo
if (par.get('drawer')) {
  document.querySelector('[data-testid="drawer-middle"]').insertAdjacentHTML(
    'beforeend', '<div class="conteudo-drawer">Dados do contato</div>');
}
const atraso = Number(par.get('nomain') || 0);
if (atraso) setTimeout(montarMain, atraso); else montarMain();

// stub do chrome.storage para rodar o content script fora da extensão
const listeners = [];
const mem = {};
window.chrome = {
  storage: {
    local: {
      get(defaults, cb) { cb({ ...defaults, ...mem }); },
      set(patch) { Object.assign(mem, patch); listeners.forEach(f => f(
        Object.fromEntries(Object.entries(patch).map(([k,v]) => [k,{newValue:v}])), 'local')); }
    },
    onChanged: { addListener(f) { listeners.push(f); } }
  }
};
</script>
<script src="../src/content.js"></script>
</body>
</html>
